# Alert rules — Day 13 Observability Lab
#
# Nguyên tắc: mỗi alert dựa trên TRIỆU CHỨNG người dùng hoặc SLO trong config/slo.yaml,
# không dựa vào tên incident nội bộ (rag_slow, tool_fail, cost_spike). Lý do: tên
# implementation có thể đổi, còn triệu chứng người dùng thì không — và một incident
# chưa biết trước sẽ không khớp bất kỳ tên nội bộ nào.
#
# Ngưỡng khớp với config/slo.yaml và threshold của panel trong config/dashboard.yaml.
# `min_sample` chống báo động giả: với traffic thấp, 1 request lỗi = 100% error rate.
#
# Phân bổ severity: critical = mất chức năng hoặc vi phạm tuân thủ (gọi page ngay);
# warning = degradation hoặc vấn đề ngân sách (xử lý trong giờ làm việc).

alerts:
  # --- Nhóm 1: SLO hạ tầng ---
  - name: HighLatencyP95
    severity: warning
    sli: latency_p95_ms
    condition: 'event == "response_sent" | percentile(latency_ms, 95) > 3000'
    for: 5m
    min_sample: 10 responses trong cửa sổ
    type: symptom-based
    owner: Đặng Thái Nam Sơn
    runbook: docs/alerts.md#alert-1

  - name: HighErrorRate
    severity: critical
    sli: error_rate_pct
    condition: 'count(event == "request_failed") / count(event == "request_received") * 100 > 2'
    for: 5m
    min_sample: 20 requests trong cửa sổ
    type: symptom-based
    owner: Trần Đình Đăng
    runbook: docs/alerts.md#alert-2

  - name: DailyCostBudgetBurn
    severity: warning
    sli: daily_cost_usd
    condition: 'event == "response_sent" | sum(cost_usd) over 24h > 2.5'
    for: 15m
    min_sample: không áp dụng (ngưỡng tuyệt đối theo ngân sách ngày)
    type: symptom-based
    owner: Chu Thành Dũng
    runbook: docs/alerts.md#alert-3

  # --- Nhóm 2: SLO đặc thù LLM/agent ---
  - name: LowQualityScore
    severity: warning
    sli: quality_score_avg
    condition: 'event == "response_sent" | mean(quality_score) < 0.75'
    for: 10m
    min_sample: 20 responses trong cửa sổ
    type: symptom-based
    owner: TODO_phân_công
    runbook: docs/alerts.md#alert-4

  - name: TrafficDropout
    severity: critical
    sli: traffic_rate_per_minute
    condition: 'count(event == "request_received") by 1m < 1'
    for: 10m
    min_sample: không áp dụng (chính sự vắng mặt của dữ liệu là tín hiệu)
    type: symptom-based
    owner: TODO_phân_công
    runbook: docs/alerts.md#alert-5

  - name: CostPerRequestSpike
    severity: warning
    sli: cost_per_request_usd
    condition: 'event == "response_sent" | mean(cost_usd) > 0.006'
    for: 10m
    min_sample: 20 responses trong cửa sổ
    type: symptom-based
    owner: TODO_phân_công
    runbook: docs/alerts.md#alert-6

  - name: OutputTokenBloat
    severity: warning
    sli: output_tokens_p95
    condition: 'event == "response_sent" | percentile(tokens_out, 95) > 400'
    for: 10m
    min_sample: 20 responses trong cửa sổ
    type: symptom-based
    owner: TODO_phân_công
    runbook: docs/alerts.md#alert-7

  - name: PIIInModelOutput
    severity: critical
    sli: pii_in_output_count
    condition: 'event == "response_sent" | count(payload.answer_preview matches "\[REDACTED_") > 0'
    for: 0m
    min_sample: không áp dụng (một lần xuất hiện đã đủ để điều tra)
    type: symptom-based
    owner: TODO_phân_công
    runbook: docs/alerts.md#alert-8

# --- Alert đề xuất, CHƯA bật được ---
# Hai alert dưới đây là best practice cho RAG/agent nhưng KHÔNG thể bắn với
# instrumentation hiện tại: `prompt_source` và cờ retrieval-miss chỉ được gửi sang
# Langfuse trong app/agent.py, chưa có trong data/logs.jsonl. Để ở block riêng để
# không lẫn với alert đang chạy thật — một alert không bao giờ bắn được còn nguy
# hiểm hơn là không có alert, vì nó tạo cảm giác an toàn giả.
planned_alerts:
  - name: PromptFallbackRate
    severity: critical
    sli: prompt_fallback_rate_pct
    condition: 'count(prompt_source == "local-fallback") / count(event == "response_sent") * 100 > 1'
    for: 5m
    type: symptom-based
    blocked_on: Thêm `prompt_source` + `prompt_fetch_error` vào log event response_sent
    runbook: docs/alerts.md#alert-9

  - name: RetrievalGroundingMiss
    severity: warning
    sli: retrieval_grounding_rate_pct
    condition: 'count(retrieval_miss == true) / count(event == "response_sent") * 100 > 10'
    for: 15m
    type: symptom-based
    blocked_on: Thêm cờ `retrieval_miss` (và `doc_count`) vào log event response_sent
    runbook: docs/alerts.md#alert-10
